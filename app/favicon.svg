<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3A2E"/>
      <stop offset="1" stop-color="#0F1A12"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8A33D"/>
      <stop offset="1" stop-color="#C97B2E"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- outer compass ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#E9E2D0" stroke-width="1.6" opacity=".55"/>
  <!-- tick marks -->
  <g stroke="#E9E2D0" stroke-width="1.4" opacity=".55">
    <line x1="32" y1="9.5" x2="32" y2="13.5"/>
    <line x1="32" y1="50.5" x2="32" y2="54.5"/>
    <line x1="9.5" y1="32" x2="13.5" y2="32"/>
    <line x1="50.5" y1="32" x2="54.5" y2="32"/>
  </g>

  <!-- compass needle (diamond), pointing north, doubles as a sprout leaf shape -->
  <path d="M32 13 L38 32 L32 51 L26 32 Z" fill="url(#needleGrad)"/>
  <path d="M32 13 L38 32 L32 32 Z" fill="#F4C878"/>

  <!-- soil/land base under the needle -->
  <path d="M17 43 C22 39.5 27 41.5 32 39.5 C37 41.5 42 39.5 47 43 L47 47 C47 47 40 44.5 32 44.5 C24 44.5 17 47 17 47 Z" fill="#5C8A5A" opacity=".9"/>

  <!-- center pivot -->
  <circle cx="32" cy="32" r="3.4" fill="#0F1A12"/>
  <circle cx="32" cy="32" r="3.4" fill="none" stroke="#E9E2D0" stroke-width="1.1" opacity=".8"/>
</svg>
