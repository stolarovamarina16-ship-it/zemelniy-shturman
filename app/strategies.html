<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Все 11 стратегий — Земельный Штурман</title>
  <meta name="description" content="Список всех 11 стратегий получения земли от государства без прохождения квиза." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { align-items: flex-start; }
    .list-page {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 56px 20px 60px;
    }
    .list-page .back-link {
      display: inline-block;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      margin-bottom: 24px;
    }
    .list-page .back-link:hover { color: var(--ochre); }
    .list-page h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--forest-950);
      margin-bottom: 8px;
    }
    .list-page .lead {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 480px;
      margin-bottom: 32px;
    }
    .strategy-list-card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .strategy-list-card .tag {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: var(--ochre);
      margin-bottom: 6px;
    }
    .strategy-list-card h2 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--forest-950);
      margin-bottom: 6px;
    }
    .strategy-list-card p {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .strategy-list-card .suitable {
      font-size: 12.5px;
      color: var(--forest-700);
    }
    .list-cta {
      display: block;
      text-align: center;
      background: linear-gradient(155deg, var(--ochre-light), var(--ochre));
      color: var(--forest-950);
      border-radius: 26px;
      padding: 15px 20px;
      font-weight: 700;
      text-decoration: none;
      margin-top: 24px;
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>
  <div class="list-page">
    <a class="back-link" href="index.html">На главную</a>
    <h1>Все 11 стратегий</h1>
    <p class="lead">
      Если не хочется проходить квиз — вот список всех стратегий получения земли от государства.
      Для персональной рекомендации под вашу ситуацию удобнее пройти <a href="index.html">короткий подбор</a>.
    </p>

    <div id="strategy-list"></div>

    <a class="list-cta" href="index.html">Подобрать стратегию под мою ситуацию</a>
  </div>

  <script src="js/strategies.js"></script>
  <script>
    const container = document.getElementById('strategy-list');
    Object.values(STRATEGIES).forEach(s => {
      const card = document.createElement('div');
      card.className = 'strategy-list-card';
      card.innerHTML = `
        <div class="tag">${s.tag}</div>
        <h2>${s.title}</h2>
        <p>${s.desc}</p>
        <div class="suitable">Подходит для: ${s.suitable.join(', ')}</div>
      `;
      container.appendChild(card);
    });
  </script>
</body>
</html>
